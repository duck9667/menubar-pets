name: MenubarPets
options:
  bundleIdPrefix: com.jakekwak.menubarpets
  deploymentTarget:
    macOS: "14.0"
targets:
  BearWalker:
    type: application
    platform: macOS
    sources:
      - Shared
      - Apps/BearWalker
