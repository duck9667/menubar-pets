      path: Apps/BearWalker/Info.plist
      properties:
        CFBundleName: 곰 산책러
        CFBundleDisplayName: 곰 산책러
        LSUIElement: true
        NSHumanReadableCopyright: jake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakekwak.menubarpets.bearwalker
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SXH247VWQA
        SWIFT_VERSION: "5"
